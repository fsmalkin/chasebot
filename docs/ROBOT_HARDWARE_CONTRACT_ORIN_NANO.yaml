robot_hardware_contract:
  version: 1
  target_name: chasecar_orin_nano
  onboard_compute:
    module: jetson_orin_nano_8gb
    cpu: 6_core_arm_a78ae
    gpu: ampere_1024_cuda_cores
    memory_gb: 8
    preferred_inference_backend: tensorrt_int8
  sensors:
    primary_depth_camera:
      model: intel_realsense_d415
      rgb:
        width: 640
        height: 480
        fps: 30
      depth:
        width: 640
        height: 480
        fps: 30
        min_range_m: 0.165
        max_range_m: 10.0
  drivetrain:
    wheel_separation_m: 0.16
    wheel_radius_m: 0.032
    max_linear_velocity_mps: 0.6
    max_angular_velocity_radps: 2.5
    cmd_vel_timeout_s: 0.5
  controller:
    update_rate_hz: 100
  safety:
    deadman_timeout_s: 0.5
    stale_detection_timeout_s: 2.0
  thermal_power:
    max_power_budget_w: 25
    throttle_protection_required: true
