name: chasebot-fast-ci

on:
  push:
  pull_request:

jobs:
  fast-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install light test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest vermin numpy opencv-python-headless

      - name: Python 3.6 compatibility gate for Jetson onboard fetch
        run: |
          vermin --target=3.6 --violations \
            tools/robot_factory_bridge/chasecar_onboard_fetch.py \
            tools/robot_factory_bridge/onboard_route_policy.py

      - name: Onboard fetch selftest
        run: |
          python tools/robot_factory_bridge/chasecar_onboard_fetch.py --selftest | tee /tmp/chasebot_onboard_selftest.json
          python - <<'PY'
          import json
          from pathlib import Path

          lines = [line for line in Path("/tmp/chasebot_onboard_selftest.json").read_text().splitlines() if line.strip()]
          verdict = json.loads(lines[-1])
          assert verdict.get("ok") is True, verdict
          PY

      - name: Python syntax and control-server import smoke
        run: |
          python - <<'PY'
          import ast
          import importlib.util
          from pathlib import Path

          roots = [Path("tools/robot_factory_bridge"), Path("scripts")]
          paths = []
          for root in roots:
              paths.extend(sorted(root.glob("*.py")))
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))
          print("ast-parsed %d Python files" % len(paths))

          path = Path("tools/robot_factory_bridge/chasecar_bridge_control_server.py")
          spec = importlib.util.spec_from_file_location("chasecar_bridge_control_server_ci", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print("control-server import smoke ok")
          PY

      - name: Control-server regression tests
        run: python -m pytest tests/test_chasecar_ci_control_server.py -q

      - name: PowerShell script parse check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path scripts -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
              throw "PowerShell parse failed for $($_.FullName)"
            }
          }
