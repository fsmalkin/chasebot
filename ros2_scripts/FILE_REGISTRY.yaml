  # ===== 3D Vision Scripts =====
  yolo_3d_position_extractor.py:
    status: ACTIVE
    purpose: "Extracts 3D positions from YOLO detections + depth data"
    version: 1.0.0
    last_updated: 2025-07-09
    dependencies: ["ROS2 Humble", "numpy"]
    working_status: VERIFIED
    topics:
      subscribes: ["/yolo/ball_position", "/yolo/confidence", "/d415/depth/image_raw", "/d415/depth/camera_info"]
      publishes: ["/yolo/ball_position_3d"]
    output: "3D coordinates in meters [x, y, z]"
    notes: "Core component of 3D vision pipeline"

  yolo_3d_direct_follower.py:
    status: ACTIVE
    purpose: "Direct proportional control follower bypassing Nav2"
    version: 1.0.0
    last_updated: 2025-07-12
    dependencies: ["ROS2 Humble", "geometry_msgs", "nav_msgs"]
    working_status: "WORKING BUT BACKWARDS"
    topics:
      subscribes: ["/yolo/ball_position_3d"]
      publishes: ["/jetbot_base_controller/cmd_vel"]
    known_issues: ["Robot moves backwards due to coordinate frame mismatch"]
    parameters:
      approach_distance: 0.15  # meters
      max_linear_speed: 0.2   # m/s
      max_angular_speed: 0.5  # rad/s
      linear_gain: 0.5
      angular_gain: 2.0
    notes: "Achieves autonomous ball following but with coordinate transformation issue"

  yolo_3d_direct_follower_v2.py:
    status: EXPERIMENTAL
    purpose: "Attempted fix for coordinate transformation issue"
    version: 2.0.0
    last_updated: 2025-07-12
    dependencies: ["ROS2 Humble", "geometry_msgs", "nav_msgs"]
    working_status: "STILL BACKWARDS"
    topics:
      subscribes: ["/yolo/ball_position_3d"]
      publishes: ["/jetbot_base_controller/cmd_vel"]
    known_issues: ["Coordinate transformation still incorrect"]
    attempted_fix: "robot_x = camera_z, robot_y = -camera_x"
    notes: "Fix attempt unsuccessful, needs different transformation"

