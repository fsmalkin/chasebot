# ROS2 Scripts File Registry
# This file tracks the status, purpose, and metadata of all scripts
# Status: ACTIVE, DEPRECATED, EXPERIMENTAL, ARCHIVE
# Last Updated: 2025-01-09

files:
  # ===== YOLO Detectors =====
  ros2_yolo_detector_frisbee.py:
    status: ACTIVE
    purpose: "YOLO detector accepting frisbee class (29) for simulated balls"
    version: 1.0.0
    last_updated: 2025-01-07
    dependencies: ["ROS2 Humble", "OpenCV", "ultralytics", "cv_bridge"]
    working_status: VERIFIED
    test_command: "python ros2_scripts/test_sports_ball_detection_uat.py"
    topics:
      subscribes: ["/d415/color/image_raw"]
      publishes: ["/yolo/debug_image", "/yolo/ball_position", "/yolo/confidence"]
    known_issues: ["Verbose logging - logs every detection"]
    notes: "Primary detector for simulation, balls appear as frisbees"

  ros2_yolo_detector_frisbee_quiet.py:
    status: ACTIVE
    purpose: "Same as frisbee.py but with reduced logging (5s summaries)"
    version: 1.0.0
    last_updated: 2025-01-09
    dependencies: ["ROS2 Humble", "OpenCV", "ultralytics", "cv_bridge"]
    working_status: VERIFIED
    test_command: "python ros2_scripts/test_3d_position_extraction.py"
    topics:
      subscribes: ["/d415/color/image_raw"]
      publishes: ["/yolo/debug_image", "/yolo/ball_position", "/yolo/confidence"]
    known_issues: []
    notes: "Best for production/demos to avoid terminal flooding"

  ros2_yolo_detector.py:
    status: DEPRECATED
    purpose: "Original YOLO detector"
    version: 0.1.0
    last_updated: 2025-01-06
    replaced_by: "ros2_yolo_detector_frisbee.py"
    issue: "Subscribes to wrong topic /camera/image_raw"
    archive_reason: "Wrong topic subscription"

  ros2_yolo_detector_fixed.py:
    status: DEPRECATED
    purpose: "Fixed topic subscription to /d415/image_raw"
    version: 0.2.0
    last_updated: 2025-01-07
    replaced_by: "ros2_yolo_detector_frisbee.py"
    issue: "Only looks for sports ball class, not frisbee"
    archive_reason: "Superseded by frisbee version"

  ros2_yolo_detector_quiet.py:
    status: DEPRECATED
    purpose: "Reduced logging version"
    version: 0.1.0
    last_updated: 2025-01-06
    replaced_by: "ros2_yolo_detector_frisbee_quiet.py"
    issue: "Wrong topic + wrong class"
    archive_reason: "Multiple issues"

  ros2_yolo_detector_silent.py:
    status: DEPRECATED
    purpose: "Even quieter logging"
    version: 0.1.0
    last_updated: 2025-01-06
    replaced_by: "ros2_yolo_detector_frisbee_quiet.py"
    issue: "Wrong topic + wrong class"
    archive_reason: "Redundant with quiet version"

  ros2_yolo_detector_sports_ball.py:
    status: DEPRECATED
    purpose: "Looks for sports ball class (32)"
    version: 0.1.0
    last_updated: 2025-01-06
    issue: "Simulated balls appear as frisbees, not sports balls"
    archive_reason: "Wrong detection class"

  ros2_yolo_detector_debug.py:
    status: EXPERIMENTAL
    purpose: "Comprehensive debug output, multi-class detection"
    version: 0.5.0
    last_updated: 2025-01-07
    dependencies: ["ROS2 Humble", "OpenCV", "ultralytics", "cv_bridge"]
    features: ["Shows all detections", "Adjustable threshold", "Multi-class"]
    potential_use: "Could be updated for advanced debugging"

  # ===== 3D Vision Scripts =====
  yolo_3d_position_extractor.py:
    status: ACTIVE
    purpose: "Extracts 3D positions from YOLO detections + depth data"
    version: 1.0.0
    last_updated: 2025-01-09
    dependencies: ["ROS2 Humble", "numpy"]
    working_status: VERIFIED
    topics:
      subscribes: ["/yolo/ball_position", "/yolo/confidence", "/d415/depth/image_raw", "/d415/depth/camera_info"]
      publishes: ["/yolo/ball_position_3d"]
    output: "3D coordinates in meters [x, y, z]"
    notes: "Core component of 3D vision pipeline"

  d415_3d_debug_viewer.py:
    status: ACTIVE
    purpose: "GUI viewer for RGB + depth + detections + 3D positions"
    version: 1.0.0
    last_updated: 2025-01-09
    dependencies: ["ROS2 Humble", "OpenCV", "numpy", "X11 display"]
    working_status: VERIFIED
    known_issues: ["Display bugs noted but functional"]
    requires: "DISPLAY environment variable set correctly"

  d415_vision_display.py:
    status: EXPERIMENTAL
    purpose: "Simple D415 camera feed display"
    version: 0.5.0
    last_updated: 2025-01-06
    notes: "May be redundant with d415_3d_debug_viewer.py"

