  # ===== YOLO Detectors =====
  ros2_yolo_detector_frisbee.py:
    status: ACTIVE
    purpose: "YOLO detector accepting frisbee class (29) for simulated balls"
    version: 1.0.0
    last_updated: 2025-07-07
    dependencies: ["ROS2 Humble", "OpenCV", "ultralytics", "cv_bridge"]
    working_status: VERIFIED
    test_command: "python ros2_scripts/test_sports_ball_detection_uat.py"
    topics:
      subscribes: ["/d415/color/image_raw"]
      publishes: ["/yolo/debug_image", "/yolo/ball_position", "/yolo/confidence"]
    known_issues: ["Verbose logging - logs every detection", "Requires display for cv2.imshow()"]
    notes: "Primary detector for simulation, balls appear as frisbees"

  ros2_yolo_detector_frisbee_quiet.py:
