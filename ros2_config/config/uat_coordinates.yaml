metadata:
  version: 1.0
  world_name: yolo_test_world
  model_sdf: ros2_config/frisbee_target_ball.sdf
  target_model_name: uat_ball_target
  cleanup_model_names:
    - red_ball_forward
    - blue_ball_left
    - yellow_ball_right
    - white_ball_behind
    - green_ball_behind
  truth_frame: d415_camera_link
  detection_topic: /yolo/ball_position_3d

defaults:
  timeout_s: 20.0
  cleanup_between_scenarios: true
  post_spawn_settle_s: 0.75
  stabilization_samples: 3
  stabilization_window_s: 2.5
  stale_after_s: 2.0
  warmup_s: 2.0

thresholds:
  detection_success_rate_min: 0.90
  mean_xy_error_max_m: 0.25
  p95_xy_error_max_m: 0.40
  max_timeout_s: 20.0

navigation_thresholds:
  approach_success_rate_min: 0.80
  median_final_distance_max_m: 0.35
  hard_failure_crashes_max: 0
  nav_observe_timeout_s: 20.0

scenarios:
  - id: center_near
    spawn_world: {x: 1.20, y: 0.00, z: 0.05}
    truth_camera: {x_m: 0.00, z_m: 1.20}
    timeout_s: 20.0

  - id: center_far
    spawn_world: {x: 2.20, y: 0.00, z: 0.05}
    truth_camera: {x_m: 0.00, z_m: 2.20}
    timeout_s: 20.0

  - id: left_offset
    spawn_world: {x: 1.50, y: 0.20, z: 0.05}
    truth_camera: {x_m: -0.20, z_m: 1.50}
    timeout_s: 20.0

  - id: right_offset
    spawn_world: {x: 1.50, y: -0.25, z: 0.05}
    truth_camera: {x_m: 0.25, z_m: 1.50}
    timeout_s: 20.0

  - id: near_depth_edge
    spawn_world: {x: 0.80, y: 0.00, z: 0.05}
    truth_camera: {x_m: 0.00, z_m: 0.80}
    timeout_s: 20.0

  - id: far_depth_edge
    spawn_world: {x: 2.80, y: 0.00, z: 0.05}
    truth_camera: {x_m: 0.00, z_m: 2.80}
    timeout_s: 20.0

  - id: left_far_offset
    spawn_world: {x: 2.10, y: 0.35, z: 0.05}
    truth_camera: {x_m: -0.35, z_m: 2.10}
    timeout_s: 20.0

  - id: right_far_offset
    spawn_world: {x: 2.10, y: -0.35, z: 0.05}
    truth_camera: {x_m: 0.35, z_m: 2.10}
    timeout_s: 20.0

  - id: intermittent_window_a
    spawn_world: {x: 1.40, y: 0.18, z: 0.05}
    truth_camera: {x_m: -0.18, z_m: 1.40}
    timeout_s: 15.0

  - id: intermittent_window_b
    spawn_world: {x: 1.40, y: -0.22, z: 0.05}
    truth_camera: {x_m: 0.22, z_m: 1.40}
    timeout_s: 15.0
