metadata:
  version: 1.0
  world_name: yolo_test_world
  model_sdf: ros2_config/green_golf_ball.sdf
  truth_frame: d415_camera_link
  detection_topic: /yolo/ball_position_3d

defaults:
  timeout_s: 20.0
  stabilization_samples: 8
  stabilization_window_s: 1.5
  stale_after_s: 1.0
  warmup_s: 2.0

thresholds:
  detection_success_rate_min: 0.90
  mean_xy_error_max_m: 0.25
  p95_xy_error_max_m: 0.40
  max_timeout_s: 20.0

navigation_thresholds:
  approach_success_rate_min: 0.80
  median_final_distance_max_m: 0.35
  hard_failure_crashes_max: 0
  nav_observe_timeout_s: 20.0

scenarios:
  - id: center_near
    spawn_world: {x: 1.20, y: 0.00, z: 0.025}
    truth_camera: {x_m: 0.00, z_m: 1.20}
    timeout_s: 20.0

  - id: center_far
    spawn_world: {x: 2.20, y: 0.00, z: 0.025}
    truth_camera: {x_m: 0.00, z_m: 2.20}
    timeout_s: 20.0

  - id: left_offset
    spawn_world: {x: 1.50, y: 0.25, z: 0.025}
    truth_camera: {x_m: -0.25, z_m: 1.50}
    timeout_s: 20.0

  - id: right_offset
    spawn_world: {x: 1.50, y: -0.25, z: 0.025}
    truth_camera: {x_m: 0.25, z_m: 1.50}
    timeout_s: 20.0

  - id: near_depth_edge
    spawn_world: {x: 0.50, y: 0.00, z: 0.025}
    truth_camera: {x_m: 0.00, z_m: 0.50}
    timeout_s: 20.0
