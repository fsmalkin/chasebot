# JetBot Differential Drive Controller Configuration - Version 1.0.0
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    jetbot_base_controller:
      type: diff_drive_controller/DiffDriveController

jetbot_base_controller:
  ros__parameters:
    publish_rate: 50.0
    
    # Wheel parameters
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    
    # Wheel separation and radius
    wheel_separation: 0.16    # 16cm between wheels
    wheel_radius: 0.032       # 3.2cm radius
    wheel_separation_multiplier: 1.0
    # The JetBot SDF wheel joints rotate with the opposite sign from the controller's
    # default assumption. Negative radius multipliers bring commanded motion, odom,
    # and Gazebo world motion back into parity.
    left_wheel_radius_multiplier: -1.0
    right_wheel_radius_multiplier: -1.0
    
    # Control parameters
    publish_cmd: true
    publish_wheel_data: true
    publish_odom: true
    publish_odom_tf: true
    
    # Odometry parameters
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    
    # Velocity and acceleration limits
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -0.5
        has_acceleration_limits: true
        max_acceleration: 1.0
        
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 2.0
        has_acceleration_limits: true
        max_acceleration: 2.0
        
    # Enable odom to base_link transform
    enable_odom_tf: true
    
    # Command velocity timeout
    cmd_vel_timeout: 0.5
    
    # Preserve turning radius when limiting speed
    preserve_turning_radius: true
