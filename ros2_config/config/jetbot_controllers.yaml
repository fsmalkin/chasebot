/**/controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    jetbot_base_controller:
      type: diff_drive_controller/DiffDriveController

/**/jetbot_base_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    
    # JetBot physical parameters
    wheel_separation: 0.16    # 160mm between wheels
    wheel_radius: 0.032       # 32mm wheel radius
    
    # Multipliers for calibration
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    
    # Publishing
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    
    # Covariance matrices
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]
    
    # Control settings
    open_loop: false
    enable_odom_tf: true
    cmd_vel_timeout: 0.5
    
    # Velocity and acceleration limits for JetBot
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 0.5      # Max 0.5 m/s
    linear.x.min_velocity: -0.5
    linear.x.max_acceleration: 1.0
    linear.x.max_jerk: .NAN
    linear.x.min_jerk: .NAN
    
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 2.0     # Max 2.0 rad/s
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.0
    angular.z.max_jerk: .NAN
    angular.z.min_jerk: .NAN
