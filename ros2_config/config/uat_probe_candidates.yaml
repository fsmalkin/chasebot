metadata:
  version: 1.0
  world_name: yolo_test_world
  model_sdf: ros2_config/frisbee_target_ball.sdf
  target_model_name: uat_ball_target
  cleanup_model_names:
    - red_ball_forward
    - blue_ball_left
    - yellow_ball_right
    - white_ball_behind
    - green_ball_behind
  truth_frame: d415_camera_link
  detection_topic: /yolo/ball_position_3d

defaults:
  timeout_s: 12.0
  cleanup_between_scenarios: true
  post_spawn_settle_s: 0.75
  stabilization_samples: 3
  stabilization_window_s: 2.5
  stale_after_s: 2.0
  warmup_s: 2.0

thresholds:
  detection_success_rate_min: 0.0
  mean_xy_error_max_m: 999.0
  p95_xy_error_max_m: 999.0
  max_timeout_s: 999.0

navigation_thresholds:
  approach_success_rate_min: 0.0
  median_final_distance_max_m: 999.0
  hard_failure_crashes_max: 999
  nav_observe_timeout_s: 1.0

scenarios:
  - id: probe_left_x1p5_y0p15
    spawn_world: {x: 1.50, y: 0.15, z: 0.05}
    truth_camera: {x_m: -0.15, z_m: 1.50}
